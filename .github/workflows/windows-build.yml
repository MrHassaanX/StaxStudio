name: Windows Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Configure
        run: >-
          cmake -S . -B ../StaxStudio-build -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_MAKE_PROGRAM=ninja
          -DCMAKE_PREFIX_PATH="$MINGW_PREFIX"
          -DSTAX_FFMPEG_ROOT="$MINGW_PREFIX"

      - name: Verify Qt tools and FFmpeg package
        run: |
          export PATH="$MINGW_PREFIX/share/qt6/bin:$PATH"
          pacman -Qi mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-declarative mingw-w64-ucrt-x86_64-qt6-multimedia mingw-w64-ucrt-x86_64-qt6-shadertools mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-ffmpeg
          command -v qmlimportscanner
          pacman -Ql mingw-w64-ucrt-x86_64-qt6-base | grep '/share/qt6/plugins/platforms/qoffscreen.dll'
          pacman -Ql mingw-w64-ucrt-x86_64-qt6-declarative | grep 'qtquickcontrols2plugin.dll'
          find "$MINGW_PREFIX" ../StaxStudio-build -iname qtquickcontrols2plugin.dll -print
          find "$MINGW_PREFIX/include" -name qrhi_p.h -print -quit | grep .

      - name: Build application and tests
        run: |
          cmake --build ../StaxStudio-build --target StaxStudio --parallel
          cmake --build ../StaxStudio-build --target StaxStudioTests --parallel
          cmake --build ../StaxStudio-build --target StaxStudioUiTests --parallel

      - name: Prepare experimental application artifact
        run: |
          test -f ../StaxStudio-build/StaxStudio.exe
          mkdir -p ci-package
          cp ../StaxStudio-build/StaxStudio.exe ci-package/
          cp ../StaxStudio-build/*.dll ci-package/
          for dir in qml plugins resources; do
            test ! -d "../StaxStudio-build/$dir" || cp -R "../StaxStudio-build/$dir" ci-package/
          done
          printf '%s\n' 'Experimental / CI-unverified build. Not a stable release.' > ci-package/STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StaxStudio-windows-ucrt64-experimental-ci-unverified
          path: ci-package/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Verify UI test startup
        run: |
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software
          export QT_PLUGIN_PATH="$(cygpath -m "$MINGW_PREFIX/share/qt6/plugins")"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$(cygpath -m "$MINGW_PREFIX/share/qt6/plugins/platforms")"
          export QML_IMPORT_PATH="$(cygpath -m "$MINGW_PREFIX/share/qt6/qml")"
          export QML2_IMPORT_PATH="$QML_IMPORT_PATH"
          export QT_QPA_FONTDIR="$(cygpath -m "$WINDIR/Fonts")"
          export QML_IMPORT_TRACE=1
          timeout 20s ../StaxStudio-build/StaxStudioUiTests.exe -functions
          timeout 45s ../StaxStudio-build/StaxStudioUiTests.exe diagnosticsPreferencePersists -v1
          timeout 45s ../StaxStudio-build/StaxStudioUiTests.exe dxgiPointerComposition -v1
          export QT_DEBUG_PLUGINS=1
          result=0
          timeout 45s ../StaxStudio-build/StaxStudioUiTests.exe visibleRowsAndRepeatedLifecycle -v1 -o startup-ui.txt,txt || result=$?
          cat startup-ui.txt
          exit "$result"

      - name: Run tests
        run: ctest --test-dir ../StaxStudio-build --parallel 4 --stop-on-failure --output-on-failure

